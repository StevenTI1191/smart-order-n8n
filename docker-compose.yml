services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    mem_limit: 1g        # batas RAM supaya aplikasi lain di server tetap aman
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=Asia/Jakarta
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Dijalankan sekali saat volume masih kosong
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Port tidak dibuka ke luar. n8n mengakses lewat hostname "postgres".

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 256m
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - n8n

volumes:
  n8n_data:
  pg_data:
